# 洗盤假說評分 v0.2
#
# 對齊工作表〈動能與洗盤〉分頁的「大盤洗盤構面」七項。
#
# ## v0.1 -> v0.2 為什麼整份重做
#
# v0.1 是照 2026-09-02 那一份工作表推的。後來讀了 Drive 上整批每日檔，
# 才發現 9/2 是第一版、而且是唯一一版用那組構面名稱的：
#
#   9/02 v1.0   法人續買與同步性 / 下跌量縮 / 支撐與收盤結構 / 融資與散戶籌碼清洗 …
#   9/03 v1.1   3-5-10日法人累計 / 回檔量與20日均量 / K線-支撐-VWAP / 融資-當沖-分點 …
#   9/07 v1.2   七構面但權重改成 20/15/15/15/15/10/10，多了「分點集中度」獨立一項
#   9/14 v1.1   九構面 15/20/12/8/10/10/10/5/10，評級門檻也從 65 改成 70
#   9/17 v2.0   五構面 25/25/20/20/10，當天只做定性判讀沒出分
#   9/23 v3.0   回到 9/03 那一組，權重 20/20/15/15/10/10/10，門檻回到 65
#
# 三週內至少改了五次。沒有一份「工作表的洗盤模型」可以照抄。
# 這份取 9/03 與 9/23 共用的那一組 —— 它是唯一出現過兩次、相隔二十天、
# 而且是最新一份完整工作表（範本 v3.0）採用的版本。
#
# ## 校準
#
# 錨點（逐構面得分）：9/03 = 19/100、9/23 = 57/100。
# 另有 9/07 的「法人累計」15/20 可交叉（同名同權重）。
# 只用這兩天完整反推，不是七條曲線各自有資料撐 —— 見檔尾「已知殘差」。
#
# 洗盤只能評估「價格與籌碼行為是否符合假說」，不能證明任何人的操縱意圖。

version: "washout-0.2"
scale: 100

# 缺值不計分，以可得滿分標準化（平台既有原則）。
coverage_gate:
  tiers:
    - min_available: 85
      status: confirmed
      publish_eos: true
      ui_badge: "資料完整"
      ui_message: ""
    - min_available: 65
      status: provisional
      publish_eos: true
      ui_badge: "暫定"
      ui_message: "部分構面尚未可得，回補後會更新"
    - min_available: 0
      status: insufficient
      publish_eos: false
      ui_badge: "資料不足"
      ui_message: "可計分構面不足，不計算洗盤分數"

# 取自 9/23〈模型與定義〉，未改動
rating_bands:
  - {min: 65, max: 100, label: "偏洗盤"}
  - {min: 40, max: 64,  label: "中性待確認"}
  - {min: 0,  max: 39,  label: "偏派發／風險釋放"}

dimensions:

  # ---------------------------------------------------------------- W1
  W1:
    name: "三日法人累計"
    max: 20
    items:
      - id: W1a
        name: "三大法人三日累計"
        max: 14
        input: institutional_net_3d_100m        # 億元
        # 9/03 -1,223.18 -> 1｜9/07 +1,130.26 -> 9｜9/23 +1,475.36 -> 9
        # 大買超封頂在 9 而不是一路線性：單日爆量買超常是被動基金調倉，
        # 再往上加分只會讓指數創高那幾天自動變成「偏洗盤」。
        bands:
          - {lt: -1000, score: 1}
          - {lt: -300,  score: 3}
          - {lt: 0,     score: 5}
          - {lt: 500,   score: 7}
          - {lt: 1600,  score: 9}
          - {lt: 2500,  score: 11}
          - {lt: null,  score: 14}
      - id: W1b
        name: "三日累計買超的法人家數"
        max: 6
        input: institutions_buying_3d            # 0-3
        # 9/03 1 家（投信）-> 2｜9/07、9/23 3 家 -> 6
        # 與 W6 的差別：這裡看三日累計方向（中期），W6 看當日方向。
        bands:
          - {lt: 1, score: 0}
          - {lt: 2, score: 2}
          - {lt: 3, score: 4}
          - {lt: null, score: 6}

  # ---------------------------------------------------------------- W2
  W2:
    name: "回檔量與市場廣度"
    max: 20
    items:
      - id: W2a
        name: "量價配合"
        max: 14
        input: turnover_change_pct               # %
        conditional_on: taiex_direction          # down / up
        # 同一個量縮，在下跌日與上漲日的意義相反。
        # 下跌日量縮 = 賣壓竭盡（洗盤證據）；上漲日量縮 = 追價力道不足（反證）。
        # 這是整個模型唯一需要條件式門檻的地方，也是 v0.1 把上漲日整天排除
        # 之後就不需要、但也因此漏掉一半樣本的原因。
        bands_by_condition:
          down:
            - {lt: -20, score: 14}
            - {lt: -10, score: 12}
            - {lt: -5,  score: 10}
            - {lt: 0,   score: 8}
            - {lt: null, score: 0}     # 價跌量增：工作表明列的派發特徵，不給部分分
          up:
            - {lt: -20, score: 3}
            - {lt: -10, score: 5}      # 9/23 -17.07% -> 5
            - {lt: 0,   score: 7}
            - {lt: 10,  score: 10}
            - {lt: 20,  score: 12}
            - {lt: null, score: 14}
      - id: W2b
        name: "市場廣度（上漲佔比）"
        max: 6
        input: advance_ratio_pct                 # 漲/(漲+跌)x100，官方股票口徑
        # 9/03 21.22% -> 0｜9/23 40.84% -> 4
        bands:
          - {lt: 25, score: 0}
          - {lt: 35, score: 2}
          - {lt: 45, score: 4}
          - {lt: 55, score: 5}
          - {lt: null, score: 6}

  # ---------------------------------------------------------------- W3
  W3:
    name: "K線與支撐結構"
    max: 15
    items:
      - id: W3a
        name: "均線結構"
        max: 5
        # 5 日線權重最重：洗盤／派發是短線判斷，月線是慢變數。
        # 9/03 跌破 5 日線、守 10/20 日線 -> 3｜9/23 三條全守 -> 5
        checks:
          - {name: "收盤站上5日線",  input: taiex_gt_ma5,  weight: 2}
          - {name: "收盤站上10日線", input: taiex_gt_ma10, weight: 1.5}
          - {name: "收盤站上20日線", input: taiex_gt_ma20, weight: 1.5}
      - id: W3b
        name: "收盤在當日區間的位置"
        max: 10
        input: close_position                    # (收盤-最低)/(最高-最低)
        # 收在全日最低 = 尾盤賣壓沒有收斂，是洗盤假說最直接的反證。
        # 9/03 0.027（距低點僅 18.3 點）-> 0｜9/23 0.588 -> 6
        bands:
          - {lt: 0.10, score: 0}
          - {lt: 0.30, score: 2}
          - {lt: 0.50, score: 4}
          - {lt: 0.65, score: 6}
          - {lt: 0.80, score: 8}
          - {lt: null, score: 10}

  # ---------------------------------------------------------------- W4
  W4:
    name: "融資籌碼清洗"
    max: 15
    items:
      - id: W4a
        name: "融資餘額日變化"
        max: 15
        input: margin_change_100m                # 億元
        # 工作表這個構面是「融資／當沖／分點」三合一。當沖與分點都沒有
        # 可用的官方來源（TWSE 當沖 JSON 端點已下線、分點無全市場總表），
        # 整個 15 分由融資承擔 —— 不是給 0，也不是假裝有資料。
        # 9/02 +75.60 -> 0｜9/23 +18.24 -> 5｜9/14 -58.52 -> 15
        bands:
          - {lt: -50, score: 15}
          - {lt: -20, score: 12}
          - {lt: 0,   score: 9}
          - {lt: 30,  score: 5}
          - {lt: 70,  score: 2}
          - {lt: null, score: 0}

  # ---------------------------------------------------------------- W5
  W5:
    name: "期貨與選擇權"
    max: 10
    items:
      - id: W5a
        name: "外資台指期淨未平倉日變化"
        max: 7
        input: foreign_futures_oi_change_1d      # 口
        # 看變化不看水位：外資淨空長期在 7-9 萬口是結構性的，
        # -85,329 這個數字本身不說明任何事，回補才是轉折訊號。
        # 9/03 +3,754（回補）-> 6｜9/23 -516（再加空）-> 3
        bands:
          - {lt: -5000, score: 0}
          - {lt: -2000, score: 1}
          - {lt: 0,     score: 3}
          - {lt: 2000,  score: 4}
          - {lt: 5000,  score: 6}
          - {lt: null,  score: 7}
      - id: W5b
        name: "臺指選擇權未平倉 P/C 比"
        max: 3
        input: txo_pc_oi_pct                     # %
        # 用未平倉比不用成交量比：成交量比一天就被當沖與價差單洗掉，
        # 未平倉比反映的是留倉方向。<100% 代表 Call 未平倉多於 Put。
        # 9/03 77.16% -> 1｜9/23 79.83% -> 1
        bands:
          - {lt: 80,  score: 1}
          - {lt: 100, score: 2}
          - {lt: null, score: 3}

  # ---------------------------------------------------------------- W6
  W6:
    name: "法人別一致性"
    max: 10
    items:
      - id: W6a
        name: "三大法人當日同向家數"
        max: 10
        input: institutions_buying               # 0-3
        # 9/03 1 家買（投信逆勢）-> 3｜9/23 2 家買（投信反向賣）-> 5
        # 三家同買才給滿分：工作表把「至少兩類同向」當門檻，三類同向才是
        # 真正的一致性。工作表原構面還含「占流通股本的實質性」，
        # 但全市場流通股本沒有官方總表，那一半併入這裡由一致性承擔。
        bands:
          - {lt: 1, score: 0}
          - {lt: 2, score: 3}
          - {lt: 3, score: 5}
          - {lt: null, score: 10}

  # ---------------------------------------------------------------- W7
  W7:
    name: "近一至三日重新站回"
    max: 10
    items:
      - id: W7a
        name: "站上前三個交易日收盤的日數"
        max: 8
        input: recovered_days_3                  # 0-3
        # 回看，不是等 T+3。工作表 9/23 這一項當天就記 8 分，證據寫
        # 「連續3日站上47,700並守住48,000」—— 問的是「近三日有沒有站回來」。
        # 這樣這 10 分當天就評得出來，不會永遠掛在「待確認」，
        # 也不會像工作表每日一檔那樣讓總分被硬壓在 90 以內。
        # 9/03 0 -> 0｜9/23 3 -> 8
        bands:
          - {lt: 1, score: 0}
          - {lt: 2, score: 3}
          - {lt: 3, score: 6}
          - {lt: null, score: 8}
      - id: W7b
        name: "廣度是否同步"
        max: 2
        # 站回來但漲家少於跌家 = 權值拉抬、個股沒跟上。
        # 9/23 正是這個情況（388 漲 / 562 跌），工作表的反證也寫「上櫃未同步」。
        checks:
          - {name: "上漲家數多於下跌家數", input: breadth_positive, weight: 1}

# ------------------------------------------------------------------ 已知殘差
#
# 以 9/03、9/23 兩天逐構面回測（詳見 tests/test_washout.py）：
#
#   構面   9/03 工作表 / 本表     9/23 工作表 / 本表
#   W1        3  /  3  OK           15 / 15  OK
#   W2        0  /  0  OK            9 /  9  OK
#   W3        2  /  3  (+1)         11 / 11  OK
#   W4      (缺) /(缺)               5 /  5  OK
#   W5        7  /  7  OK            4 /  4  OK
#   W6        3  /  3  OK            5 /  5  OK
#   W7        0  /  0  OK            8 /  8  OK
#   總分     19  / 19  OK           57 / 58  (+1)
#
# W3 在 9/03 高 1 分：工作表只給 2 分，但當天確實守住 10 日線（高 18.17 點）
# 與 20 日線。要壓到 2 分就得讓 5 日線以外的均線幾乎不給分，那會讓
# 「跌破月線」在別的日子失去分辨力。留著這 1 分的偏差，不為了對齊而扭曲曲線。
#
# ------------------------------------------------------------------ 仍未解決
#
# Q5  校準樣本仍然只有兩天完整逐構面。另有四天只有總分可交叉
#     （9/07 67、9/14 45、9/22 約 40、9/24 53），但 9/07 與 9/14 用的是
#     不同構面集，只能當方向參考，不能當門檻證據。
#     再多三到五天的逐構面得分，門檻就能從「反推」升級成「回歸」。
#
# Q6  9/14 那一版把偏洗盤門檻從 65 改成 70，9/23 又改回 65。
#     本表採 65（最新一版）。若你認為 70 才對，改 rating_bands 即可，
#     不需要動程式。
