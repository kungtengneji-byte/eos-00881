# 洗盤假說評分 v0.1（草案，待審）
#
# 對齊工作表〈動能與洗盤〉分頁的七個構面與總門檻。
# 工作表只給了構面上限與總門檻（>=65 偏洗盤 / 40-64 中性 / <40 偏派發），
# **各構面內部怎麼給分沒有寫**，這份草案就是把那一層補起來。
#
# 校準錨點只有一個：2026-09-02（工作表 v1.0 那一天）。
# 下面每一個門檻都以「能重現那天的逐構面得分」為約束反推，
# 但一個錨點撐不起七條計分曲線 —— 門檻的**形狀**是我設的，不是資料逼出來的。
# 這是草案而不是定案的原因。
#
#   構面                上限   工作表當日   本草案
#   法人續買與同步性      20        0          0
#   下跌量縮             20       14         14
#   支撐與收盤結構        15        8          8
#   融資／散戶籌碼清洗    15        0          0
#   期貨部位確認          10        0          0
#   局部相對強勢          10        6          6
#   後續1-3日收復確認     10        0       （未到期，留白）
#   合計                100       28         28
#
# 洗盤只能評估「價格與籌碼行為是否符合假說」，不能證明任何人的操縱意圖。
# 這一點沿用工作表的原話，不放寬。

version: "washout-0.1-draft"
scale: 100

# 覆蓋率閘門沿用平台既有規則：缺值不計分，以可得滿分標準化。
# **這是與工作表的一個實質差異**，見檔尾 Q2。
coverage_gate:
  tiers:
    - min_available: 85
      status: confirmed
      publish_eos: true
      ui_badge: "資料完整"
      ui_message: ""
    - min_available: 70
      status: provisional
      publish_eos: true
      ui_badge: "暫定"
      ui_message: "部分構面尚未可得，回補後會更新"
    - min_available: 0
      status: insufficient
      publish_eos: false
      ui_badge: "資料不足"
      ui_message: "可計分構面不足，不計算洗盤分數"

# 門檻取自工作表〈模型與定義〉，未改動
rating_bands:
  - {min: 65, max: 100, label: "偏洗盤"}
  - {min: 40, max: 64,  label: "中性"}
  - {min: 0,  max: 39,  label: "偏派發／風險釋放"}

dimensions:

  # ---------------------------------------------------------------- W1
  W1:
    name: "法人續買與同步性"
    max: 20
    items:
      - id: W1a
        name: "三大法人合計買賣超"
        max: 14
        input: institutional_net_100m        # 億元，TWSE BFI82U
        # 2026-09-02：-1,152.44 -> 0
        bands:
          - {lt: -500, score: 0}
          - {lt: -200, score: 2}
          - {lt: 0,    score: 5}
          - {lt: 200,  score: 8}
          - {lt: 500,  score: 11}
          - {lt: null, score: 14}
      - id: W1b
        name: "三大法人同步性"
        max: 6
        # 三家各自是否買超。同步賣超是最強的反證，所以這一項獨立於金額大小。
        # 2026-09-02：0/3 -> 0
        checks:
          - {name: "外資買超", input: foreign_is_buying, weight: 1}
          - {name: "投信買超", input: trust_is_buying,   weight: 1}
          - {name: "自營買超", input: dealer_is_buying,  weight: 1}

  # ---------------------------------------------------------------- W2
  W2:
    name: "下跌量縮"
    max: 20
    items:
      - id: W2a
        name: "成交金額日變化"
        max: 20
        input: turnover_change_pct           # %，TWSE 官方口徑
        # 2026-09-02：-18.33% -> 14
        # 量縮只能「減輕派發疑慮」，不能單獨定義洗盤 —— 所以即使爆量縮
        # 也只給滿分 20，不讓它主導總分（它本來就只佔 20/100）。
        bands:
          - {lt: -30, score: 20}
          - {lt: -20, score: 17}
          - {lt: -10, score: 14}
          - {lt: 0,   score: 9}
          - {lt: 10,  score: 4}
          - {lt: null, score: 0}

  # ---------------------------------------------------------------- W3
  W3:
    name: "支撐與收盤結構"
    max: 15
    items:
      - id: W3a
        name: "均線支撐"
        max: 8
        # 2026-09-02：月線 +1.53%、季線 +2.65%，兩項皆成立 -> 8
        checks:
          - {name: "收盤守月線", input: taiex_gt_ma20, weight: 1}
          - {name: "收盤守季線", input: taiex_gt_ma60, weight: 1}
      - id: W3b
        name: "收盤在當日區間的位置"
        max: 7
        input: close_position                # (收盤-最低)/(最高-最低)
        # 2026-09-02：收盤 = 全日最低 -> 0.00 -> 0
        # 收在最低代表尾盤賣壓沒有收斂，是洗盤假說最直接的反證之一。
        bands:
          - {lt: 0.10, score: 0}
          - {lt: 0.33, score: 2}
          - {lt: 0.66, score: 4}
          - {lt: null, score: 7}

  # ---------------------------------------------------------------- W4
  W4:
    name: "融資／散戶籌碼清洗"
    max: 15
    items:
      - id: W4a
        name: "融資餘額日變化"
        max: 15
        input: margin_change_100m            # 億元
        # 2026-09-02：+75.60（大盤重挫時融資反增）-> 0
        # 工作表這個構面還含「散戶期貨多空比」，但那來自 WantGoo／Blave
        # 兩個二級來源，平台取不到，因此整個 15 分先由融資承擔。見 Q3。
        bands:
          - {lt: -100, score: 15}
          - {lt: -50,  score: 12}
          - {lt: 0,    score: 8}
          - {lt: 50,   score: 3}
          - {lt: null, score: 0}

  # ---------------------------------------------------------------- W5
  W5:
    name: "期貨部位確認"
    max: 10
    items:
      - id: W5a
        name: "外資台指期淨未平倉日變化"
        max: 10
        input: foreign_futures_oi_change_1d  # 口
        # 2026-09-02：-6,623（單日再增空）-> 0
        # 看「變化」而不是「水位」：長期淨空是結構性的，回補才是轉折訊號。
        bands:
          - {lt: -5000, score: 0}
          - {lt: -2000, score: 1}
          - {lt: 0,     score: 3}
          - {lt: 2000,  score: 6}
          - {lt: 5000,  score: 8}
          - {lt: null,  score: 10}

  # ---------------------------------------------------------------- W6
  W6:
    name: "局部相對強勢"
    max: 10
    items:
      - id: W6a
        name: "逆勢上漲產業數"
        max: 4
        input: sectors_up_count
        # 2026-09-02：金融 +0.45%、塑膠 +0.26%，共 2 個 -> 2
        bands:
          - {lt: 1, score: 0}
          - {lt: 2, score: 1}
          - {lt: 4, score: 2}
          - {lt: 6, score: 3}
          - {lt: null, score: 4}
      - id: W6b
        name: "漲停家數"
        max: 3
        input: limit_up_count
        # 2026-09-02：12 檔 -> 2
        bands:
          - {lt: 3,  score: 0}
          - {lt: 10, score: 1}
          - {lt: 30, score: 2}
          - {lt: null, score: 3}
      - id: W6c
        name: "市場廣度（上漲佔比）"
        max: 3
        input: advance_ratio_pct
        # 2026-09-02：官方口徑 398 漲 / 563 跌 -> 41.4% -> 2
        bands:
          - {lt: 30, score: 0}
          - {lt: 40, score: 1}
          - {lt: 55, score: 2}
          - {lt: null, score: 3}

  # ---------------------------------------------------------------- W7
  W7:
    name: "後續1-3日收復確認"
    max: 10
    items:
      - id: W7a
        name: "幾個交易日內收復當日跌幅"
        max: 10
        input: recover_in_days               # 1/2/3；0=三日內未收復；缺值=尚未到期
        # 收復定義：T+1~T+3 任一日收盤 >= T-1 日收盤（把當天的跌幅補回）。
        #
        # 工作表是每天一檔，這一項當天永遠是「待確認」記 0 分，
        # 等於這 10 分**永遠拿不到**，總分被硬壓在 90 以內。
        # 平台有連續歷史，T 日這一項可以在 T+3 自動回補 —— 未到期時留白
        # 不計分（由覆蓋率閘門排除），而不是當成 0。見 Q2。
        bands:
          - {lt: 1, score: 0}      # 0 = 三日內未收復
          - {lt: 2, score: 10}     # 1 = T+1 就收復
          - {lt: 3, score: 7}      # 2 = T+2
          - {lt: null, score: 4}   # 3 = T+3

# ------------------------------------------------------------------ 待裁決
#
# Q1  上漲日怎麼處理？
#     這個模型的前提是「這次下跌是洗盤還是派發」，大盤上漲時問題本身不成立。
#     選項 A：只在下跌日出分，上漲日標示「不適用」（建議）
#     選項 B：照常出分，但 W2「下跌量縮」改成不適用並由覆蓋率閘門排除
#     選項 C：照常出分，所有構面都照算
#
# Q2  W7 未到期時記 0 還是留白？
#     工作表記 0，總分因此永遠 <= 90。平台的既有原則是「缺值不計分、
#     以可得滿分標準化」。照平台原則，2026-09-02 會是 28/90 -> 31 分
#     （工作表是 28/100 -> 28 分）。兩者都落在「偏派發」，但別的日子可能跨級。
#     選項 A：留白不計分，T+3 回補後升級（建議，與平台其他模型一致）
#     選項 B：照工作表記 0
#
# Q3  散戶期貨多空比取不到，W4 的 15 分怎麼分？
#     選項 A：整個 15 分由融資承擔（本草案採用）
#     選項 B：融資 10 分，散戶期貨 5 分留白不計分（總可得滿分降為 95）
#     選項 C：你提供可取得的來源，補回 5 分
#
# Q4  W6a「逆勢上漲產業數」的產業報酬怎麼算？
#     平台有全市場逐檔漲跌與產業別，可以算產業內個股的
#     選項 A：簡單平均（建議，與工作表的類股漲跌率量級較接近）
#     選項 B：成交值加權（大型股主導，較接近類股指數）
