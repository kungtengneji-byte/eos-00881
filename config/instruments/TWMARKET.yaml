# 台股大盤資金流向。與 00881 不同，這不是一檔基金 ——
# 沒有 NAV、沒有成分股，模型輸出是「外資續買燈號」而非 EOS。
instrument: "TWMARKET"
kind: "market"
name: "台股大盤資金流向"
rubric: "market_rubric_v1.0.yaml"

# F1/F2 的分母與 F4 的前高都取自這個滾動視窗（見 market_rubric_v1.0.yaml 的 windowing）
lookback_days: 60

# W4 回補窗往回掃幾天。期交所的定版資料偶爾隔日才更新，7 天足夠。
backfill_days: 7

# 連續買賣 Top5（對齊工作表〈連續買賣Top5〉分頁）
#
# 工作表的選股規則第一條是「同一法人連續同向 ≥ 門檻日數」，門檻值本身
# 沒能從 Google Sheets 連接器讀回來（只取得到被截斷的規則文字），
# 這裡先採台股常用的 3 日，其餘條件（成交量下限、排除處置股等）尚未實作。
# 確認工作表的實際門檻後改這裡即可，不必動程式。
streaks:
  min_days: 3
  top_n: 5
  lookback_days: 60
