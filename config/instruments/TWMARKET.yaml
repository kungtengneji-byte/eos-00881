# 台股大盤資金流向。與 00881 不同，這不是一檔基金 ——
# 沒有 NAV、沒有成分股，模型輸出是「外資續買燈號」而非 EOS。
instrument: "TWMARKET"
kind: "market"
name: "台股大盤資金流向"
rubric: "market_rubric_v1.0.yaml"

# 洗盤假說是掛在大盤上的第二份 rubric，共用同一份每日快照。
# 對齊工作表〈動能與洗盤〉的「大盤洗盤構面」；門檻與殘差見該 YAML 檔頭。
washout_rubric: "washout_rubric_v0.2.yaml"

# F1/F2 的分母與 F4 的前高都取自這個滾動視窗（見 market_rubric_v1.0.yaml 的 windowing）
lookback_days: 60

# W4 回補窗往回掃幾天。期交所的定版資料偶爾隔日才更新，7 天足夠。
backfill_days: 7

# 連續買賣 Top5 —— 參數與計分式取自工作表〈連續買賣Top5〉左上角的藍字可調區。
#
#   分數 = 天數 × 天數權重 + 狀態加分 + 兩類以上法人同向加分 + 天數/100
#
# 最後那一項工作表的規則沒有寫出來，但七筆實例裡有六筆只有加上它才對得起來，
# 它是同分時的排序尾數。狀態：持續中（連到最新資料日）／待確認（最新日該檔
# 無法人紀錄）／已中斷（最新日有紀錄但轉向或歸零）。
streaks:
  min_days: 3                   # 連續門檻(日)
  day_weight: 1                 # 天數權重
  bonus_running: 10             # 持續中加分
  bonus_pending: 5              # 待確認加分
  bonus_multi_institution: 3    # 兩類以上法人同向加分
  top_n: 5

  # 連續天數的計算視窗。2026-09-27 由 60 調到 128：原本五檔（玉山金、00940、
  # 00900、00932、智易）的連續天數剛好等於整個視窗，那不是天數而是視窗長度，
  # 表上只能標「≥」。回填半年 T86 之後才量得到真實值。
  lookback_days: 128

  # 〈個股法人明細〉表格列出的天數，與上面拆開。
  # 連續天數仍用完整視窗算，只有顯示截尾 —— 若改成只用最近 40 天去算，
  # 截斷處的連續天數會從 1 重新起算，這一頁就會跟 Top5 那一頁互相矛盾。
  detail_days: 40
